aid: runreveal
name: RunReveal
description: >-
  RunReveal is a unified security log management and detection platform that
  replaces traditional SIEM with a scalable security data lake, AI-powered
  detection engineering, and natural-language investigations. It ingests and
  normalizes security logs from 100+ sources (object storage, forwarders, and
  webhook/API polling), runs detections-as-code (native and Sigma), and lets
  analysts query with SQL or PQL, build dashboards, and route alerts. RunReveal
  exposes a REST API, a JSON-in/JSON-out CLI, OAuth-based access with granular
  workspace scopes, and both hosted-remote and local Model Context Protocol
  (MCP) servers for AI-agent integration. Backed by Costanoa Ventures.
